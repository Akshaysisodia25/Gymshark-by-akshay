<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymshark.login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login">
        <a href="http://127.0.0.1:5500/Gymshark.html"><img src="https://logos-world.net/wp-content/uploads/2022/01/Gymshark-Logo.png" width="120px" alt="gymshark"></a>
        <h2>GYMSHARK LOGIN</h2>
    </div>

    <div class="p">
        <p>Shop your styles, save top picks to your wishlist, track those orders & train with us.</p>
    </div>

    <div class="email">
        <input type="email" placeholder="Email address*" required>
        <br>
        <input type="password" placeholder="Password*" required>
    </div>

    <div class="fp">
        <p>Forgot password?</p>
    </div>
    
    <div class="button">
        <a href="http://127.0.0.1:5500/Gymshark.html"><button>LOG IN</button></a>
    </div>

    <div class="signup">
        <p>Don't have an account? <span style="text-decoration: underline; font-weight: 800;">Sign up</span></p>
    </div>
</body>
</html>
